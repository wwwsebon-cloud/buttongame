<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUTTON</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BUTTON">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Pretendard", "Inter", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  .btn {
    appearance: none;
    border: none;
    background: #fff;
    color: #000;
    font: inherit;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.25s ease, background 0.2s ease;
  }
  .btn:hover { box-shadow: 0 0 32px rgba(255, 255, 255, 0.35); }
  .btn:active { transform: scale(0.94); }

  .btn.menu {
    width: min(260px, 70vw);
    padding: 18px 0;
    font-size: 16px;
  }

  .title {
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  /* 인게임 */
  #game-btn {
    width: min(42vmin, 320px);
    height: min(42vmin, 320px);
    font-size: 20px;
    border-radius: 50%;
    touch-action: manipulation;
    transition: transform 0.05s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease;
  }
  #game-btn:active,
  #game-btn.pressed { transform: scale(0.91); }

  .score {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-height: 1em;
  }
  .score.bump { animation: bump 0.18s ease; }
  @keyframes bump {
    from { transform: scale(1.18); }
    to   { transform: scale(1); }
  }

  .back {
    position: fixed;
    top: 20px;
    left: 20px;
    background: none;
    border: none;
    color: #888;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .back:hover { color: #fff; }

  /* 업그레이드 탭 & 패널 */
  .upgrade-tab-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.32);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .upgrade-tab-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .upgrade-tab-btn:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .upgrade-panel {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 20;
  }
  .upgrade-panel.open {
    opacity: 1;
    pointer-events: auto;
  }
  .upgrade-box {
    width: min(400px, 88vw);
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .upgrade-box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .upgrade-box-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .upgrade-close {
    background: none;
    border: none;
    color: #888;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .upgrade-close:hover { color: #fff; }
  .upgrade-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.03);
  }
  .upgrade-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .upgrade-name {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }
  .upgrade-desc {
    font-size: 13px;
    color: #999;
  }
  .upgrade-buy {
    flex-shrink: 0;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
  }
  .upgrade-buy:disabled {
    background: rgba(255, 255, 255, 0.12);
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* 패치노트 */
  .notes-wrap {
    width: min(560px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .notes-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.16);
  }
  .notes-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .notes-count {
    font-size: 12px;
    color: #777;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
  }
  .notes {
    max-height: 62vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-right: 2px;
    scrollbar-width: none;
  }
  .notes::-webkit-scrollbar { display: none; }
  .note-card {
    position: relative;
    padding: 18px 20px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.025);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .note-card:hover {
    border-color: rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.045);
  }
  .note-card.latest {
    border-color: rgba(255, 255, 255, 0.38);
    background: rgba(255, 255, 255, 0.06);
  }
  .note-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .note-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .note-version {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #fff;
  }
  .note-card.latest .note-version {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .note-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #aaa;
    text-transform: uppercase;
  }
  .note-date {
    font-size: 12px;
    color: #666;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .note-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: #ccc;
    font-size: 14px;
    line-height: 1.55;
  }
  .note-list li {
    position: relative;
    padding-left: 14px;
  }
  .note-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #777;
  }
  .note-card.latest .note-list { color: #eee; }
  .note-card.latest .note-list li::before { background: #fff; }
</style>
</head>
<body>

  <!-- 타이틀 -->
  <section id="title" class="screen active">
    <h1 class="title">BUTTON</h1>
    <button class="btn menu" id="btn-start">게임 시작</button>
    <button class="btn menu" id="btn-notes">패치노트</button>
  </section>

  <!-- 인게임 -->
  <section id="game" class="screen">
    <button class="back" data-go="title">← 나가기</button>
    <button class="upgrade-tab-btn" id="btn-upgrade-tab">업그레이드</button>
    <div class="score" id="score">0</div>
    <button class="btn" id="game-btn">PRESS</button>

    <div class="upgrade-panel" id="upgrade-panel">
      <div class="upgrade-box">
        <div class="upgrade-box-head">
          <span class="upgrade-box-title">Upgrade</span>
          <button class="upgrade-close" id="btn-upgrade-close">닫기</button>
        </div>
        <div class="upgrade-item">
          <div class="upgrade-info">
            <span class="upgrade-name">더블 클릭</span>
            <span class="upgrade-desc">클릭당 점수 1 → 2 (1회 한정)</span>
          </div>
          <button class="btn upgrade-buy" id="btn-buy-double">100점</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 패치노트 -->
  <section id="notes" class="screen">
    <button class="back" data-go="title">← 나가기</button>
    <div class="notes-wrap">
      <div class="notes-header">
        <h2 class="notes-title">Patch Notes</h2>
        <span class="notes-count" id="notes-count"></span>
      </div>
      <div class="notes" id="notes-list"></div>
    </div>
  </section>

<script>
  // ===== 패치노트 데이터 =====
  // 업데이트할 때마다 맨 위에 새 항목을 추가하세요. (v1부터 1씩 증가)
  const PATCH_NOTES = [
    {
      version: 3,
      date: "2026-11-21",
      changes: [
        "버튼을 100번 누르면 업그레이드 탭 해금",
        "100점을 소모해 클릭당 점수를 2로 올리는 업그레이드 추가 (1회 한정)",
      ],
    },
    {
      version: 2,
      date: "2026-11-21",
      changes: [
        "패치노트 UI를 블랙 & 화이트 카드 스타일로 개선",
        "버튼 입력 딜레이 제거 (누르는 즉시 반응)",
      ],
    },
    {
      version: 1,
      date: "2025-01-01",
      changes: [
        "최초 출시",
        "버튼을 누르면 1점 획득",
      ],
    },
  ];

  // ===== 화면 전환 =====
  const screens = {
    title: document.getElementById("title"),
    game: document.getElementById("game"),
    notes: document.getElementById("notes"),
  };

  function go(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  // ===== 패치노트 렌더링 =====
  function renderNotes() {
    const list = document.getElementById("notes-list");
    const count = document.getElementById("notes-count");
    const latestVersion = PATCH_NOTES[0]?.version ?? 0;
    count.textContent = `LATEST v${latestVersion}`;

    list.innerHTML = PATCH_NOTES.map((n, idx) => `
      <article class="note-card${idx === 0 ? " latest" : ""}">
        <div class="note-head">
          <div class="note-meta">
            <span class="note-version">v${n.version}</span>
            ${idx === 0 ? '<span class="note-badge">LATEST</span>' : ""}
          </div>
          <span class="note-date">${n.date}</span>
        </div>
        <ul class="note-list">
          ${n.changes.map(c => `<li>${c}</li>`).join("")}
        </ul>
      </article>
    `).join("");
  }
  renderNotes();

  // ===== 인게임 로직 =====
  let score = 0;
  let totalClicks = 0;
  let pointsPerClick = 1;
  let upgradeUnlocked = false;
  let doubleBought = false;

  const scoreEl = document.getElementById("score");
  const gameBtn = document.getElementById("game-btn");
  const upgradeTabBtn = document.getElementById("btn-upgrade-tab");
  const upgradePanel = document.getElementById("upgrade-panel");
  const upgradeCloseBtn = document.getElementById("btn-upgrade-close");
  const buyDoubleBtn = document.getElementById("btn-buy-double");

  function updateUpgradeUI() {
    upgradeTabBtn.classList.toggle("visible", upgradeUnlocked);
    if (doubleBought) {
      buyDoubleBtn.textContent = "완료";
      buyDoubleBtn.disabled = true;
    } else {
      buyDoubleBtn.textContent = "100점";
      buyDoubleBtn.disabled = score < 100;
    }
  }

  function resetGame() {
    score = 0;
    totalClicks = 0;
    pointsPerClick = 1;
    upgradeUnlocked = false;
    doubleBought = false;
    scoreEl.textContent = score;
    upgradePanel.classList.remove("open");
    updateUpgradeUI();
  }

  function pressButton() {
    totalClicks += 1;
    score += pointsPerClick;
    scoreEl.textContent = score;
    scoreEl.classList.remove("bump");
    void scoreEl.offsetWidth; // 애니메이션 재시작
    scoreEl.classList.add("bump");

    if (!upgradeUnlocked && totalClicks >= 100) {
      upgradeUnlocked = true;
    }
    updateUpgradeUI();
  }

  upgradeTabBtn.addEventListener("click", () => {
    updateUpgradeUI();
    upgradePanel.classList.add("open");
  });

  upgradeCloseBtn.addEventListener("click", () => {
    upgradePanel.classList.remove("open");
  });

  upgradePanel.addEventListener("click", (e) => {
    if (e.target === upgradePanel) {
      upgradePanel.classList.remove("open");
    }
  });

  buyDoubleBtn.addEventListener("click", () => {
    if (doubleBought || score < 100) return;
    score -= 100;
    pointsPerClick = 2;
    doubleBought = true;
    scoreEl.textContent = score;
    updateUpgradeUI();
  });

  gameBtn.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    gameBtn.classList.add("pressed");
    pressButton();
  });

  const releaseVisual = () => gameBtn.classList.remove("pressed");
  gameBtn.addEventListener("pointerup", releaseVisual);
  gameBtn.addEventListener("pointercancel", releaseVisual);
  gameBtn.addEventListener("pointerleave", releaseVisual);

  gameBtn.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && !e.repeat) {
      e.preventDefault();
      gameBtn.classList.add("pressed");
      pressButton();
    }
  });
  gameBtn.addEventListener("keyup", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      releaseVisual();
    }
  });

  // ===== 버튼 이벤트 =====
  document.getElementById("btn-start").addEventListener("click", () => {
    resetGame();
    go("game");
  });
  document.getElementById("btn-notes").addEventListener("click", () => go("notes"));
  document.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => go(b.dataset.go))
  );
</script>
</body>
</html>
