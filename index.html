<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUTTON</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BUTTON">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Pretendard", "Inter", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  .btn {
    appearance: none;
    border: none;
    background: #fff;
    color: #000;
    font: inherit;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.25s ease, background 0.2s ease;
  }
  .btn:hover { box-shadow: 0 0 32px rgba(255, 255, 255, 0.35); }
  .btn:active { transform: scale(0.94); }

  .btn.menu {
    width: min(260px, 70vw);
    padding: 18px 0;
    font-size: 16px;
  }

  .title {
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  /* 인게임 */
  #ball-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  #game > :not(#ball-canvas) {
    position: relative;
    z-index: 1;
  }
  #game > .back,
  #game > .upgrade-tab-btn,
  #game > .upgrade-panel {
    position: fixed;
  }
  #game > .back,
  #game > .upgrade-tab-btn {
    z-index: 10;
  }
  #game > .upgrade-panel {
    z-index: 20;
  }
  #game-btn {
    width: min(42vmin, 320px);
    height: min(42vmin, 320px);
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    font-size: 20px;
    border-radius: 50%;
    touch-action: manipulation;
    transition: transform 0.05s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease;
  }
  #game-btn:active,
  #game-btn.pressed { transform: scale(0.91); }

  .score {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-height: 1em;
  }
  .score.bump { animation: bump 0.18s ease; }
  @keyframes bump {
    from { transform: scale(1.18); }
    to   { transform: scale(1); }
  }

  .back {
    position: fixed;
    top: 20px;
    left: 20px;
    background: none;
    border: none;
    color: #888;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .back:hover { color: #fff; }

  /* 업그레이드 탭 & 패널 */
  .upgrade-tab-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.34);
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(8px);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .upgrade-tab-btn::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
  }
  .upgrade-tab-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .upgrade-tab-btn:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
    box-shadow: 0 0 24px rgba(255, 255, 255, 0.28);
  }
  .upgrade-tab-btn:hover::before {
    background: #000;
    box-shadow: none;
  }
  .upgrade-panel {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.88) 65%);
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease;
    z-index: 20;
  }
  .upgrade-panel.open {
    opacity: 1;
    pointer-events: auto;
  }
  .upgrade-box {
    position: relative;
    width: min(460px, 92vw);
    max-height: 84vh;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 26px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: linear-gradient(180deg, rgba(22, 22, 22, 0.96) 0%, rgba(8, 8, 8, 0.98) 100%);
    box-shadow:
      0 24px 80px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset,
      0 1px 0 rgba(255, 255, 255, 0.22) inset;
    display: flex;
    flex-direction: column;
    gap: 18px;
    transform: translateY(10px) scale(0.97);
    transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .upgrade-box::-webkit-scrollbar { display: none; }
  .upgrade-panel.open .upgrade-box {
    transform: translateY(0) scale(1);
  }
  .upgrade-box-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .upgrade-title-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .upgrade-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #777;
    text-transform: uppercase;
  }
  .upgrade-box-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .upgrade-close {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.04);
    color: #aaa;
    font: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .upgrade-close:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .upgrade-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .upgrade-stat {
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.03);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .upgrade-stat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #777;
    text-transform: uppercase;
  }
  .upgrade-stat-val {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .upgrade-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .upgrade-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.025);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  .upgrade-item:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  }
  .upgrade-item.bought {
    opacity: 0.58;
    border-style: dashed;
  }
  .upgrade-item.bought:hover {
    transform: none;
    box-shadow: none;
  }
  .upgrade-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .upgrade-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.05);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .upgrade-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .upgrade-name-row {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .upgrade-name {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }
  .upgrade-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #bbb;
    text-transform: uppercase;
  }
  .upgrade-desc {
    font-size: 12.5px;
    color: #999;
    line-height: 1.4;
  }
  .upgrade-buy {
    flex-shrink: 0;
    min-width: 82px;
    padding: 10px 14px;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .upgrade-buy:disabled {
    background: rgba(255, 255, 255, 0.09);
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* 패치노트 */
  .notes-wrap {
    width: min(560px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .notes-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.16);
  }
  .notes-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .notes-count {
    font-size: 12px;
    color: #777;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
  }
  .notes {
    max-height: 62vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-right: 2px;
    scrollbar-width: none;
  }
  .notes::-webkit-scrollbar { display: none; }
  .note-card {
    position: relative;
    padding: 18px 20px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.025);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .note-card:hover {
    border-color: rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.045);
  }
  .note-card.latest {
    border-color: rgba(255, 255, 255, 0.38);
    background: rgba(255, 255, 255, 0.06);
  }
  .note-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .note-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .note-version {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #fff;
  }
  .note-card.latest .note-version {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .note-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #aaa;
    text-transform: uppercase;
  }
  .note-date {
    font-size: 12px;
    color: #666;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .note-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: #ccc;
    font-size: 14px;
    line-height: 1.55;
  }
  .note-list li {
    position: relative;
    padding-left: 14px;
  }
  .note-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #777;
  }
  .note-card.latest .note-list { color: #eee; }
  .note-card.latest .note-list li::before { background: #fff; }
</style>
</head>
<body>

  <!-- 타이틀 -->
  <section id="title" class="screen active">
    <h1 class="title">BUTTON</h1>
    <button class="btn menu" id="btn-start">게임 시작</button>
    <button class="btn menu" id="btn-notes">패치노트</button>
  </section>

  <!-- 인게임 -->
  <section id="game" class="screen">
    <canvas id="ball-canvas"></canvas>
    <button class="back" data-go="title">← 나가기</button>
    <button class="upgrade-tab-btn" id="btn-upgrade-tab">업그레이드</button>
    <div class="score" id="score">0</div>
    <button class="btn" id="game-btn">PRESS</button>

    <div class="upgrade-panel" id="upgrade-panel">
      <div class="upgrade-box">
        <div class="upgrade-box-head">
          <div class="upgrade-title-group">
            <span class="upgrade-eyebrow">System Enhancement</span>
            <span class="upgrade-box-title">Upgrades</span>
          </div>
          <button class="upgrade-close" id="btn-upgrade-close" aria-label="닫기">✕</button>
        </div>

        <div class="upgrade-stats">
          <div class="upgrade-stat">
            <span class="upgrade-stat-label">Score</span>
            <span class="upgrade-stat-val" id="upgrade-score">0</span>
          </div>
          <div class="upgrade-stat">
            <span class="upgrade-stat-label">Per Click</span>
            <span class="upgrade-stat-val" id="upgrade-ppc">+1</span>
          </div>
        </div>

        <div class="upgrade-list">
          <div class="upgrade-item" id="item-double">
            <div class="upgrade-left">
              <div class="upgrade-icon">×2</div>
              <div class="upgrade-info">
                <div class="upgrade-name-row">
                  <span class="upgrade-name">더블 클릭</span>
                  <span class="upgrade-tag">CLICK</span>
                </div>
                <span class="upgrade-desc">클릭당 점수 1 → 2 (1회 한정)</span>
              </div>
            </div>
            <button class="btn upgrade-buy" id="btn-buy-double">100점</button>
          </div>

          <div class="upgrade-item" id="item-ball">
            <div class="upgrade-left">
              <div class="upgrade-icon">●</div>
              <div class="upgrade-info">
                <div class="upgrade-name-row">
                  <span class="upgrade-name">바운스 볼 <span id="ball-count" style="color:#888;font-weight:500;">(0)</span></span>
                  <span class="upgrade-tag">AUTO</span>
                </div>
                <span class="upgrade-desc">벽·버튼에 튕길 때마다 +2점</span>
              </div>
            </div>
            <button class="btn upgrade-buy" id="btn-buy-ball">200점</button>
          </div>

          <div class="upgrade-item" id="item-plus3">
            <div class="upgrade-left">
              <div class="upgrade-icon">+3</div>
              <div class="upgrade-info">
                <div class="upgrade-name-row">
                  <span class="upgrade-name">파워 클릭</span>
                  <span class="upgrade-tag">CLICK</span>
                </div>
                <span class="upgrade-desc">클릭당 점수 +3 (1회 한정)</span>
              </div>
            </div>
            <button class="btn upgrade-buy" id="btn-buy-plus3">300점</button>
          </div>

          <div class="upgrade-item" id="item-enter">
            <div class="upgrade-left">
              <div class="upgrade-icon">↵</div>
              <div class="upgrade-info">
                <div class="upgrade-name-row">
                  <span class="upgrade-name">엔터 클릭</span>
                  <span class="upgrade-tag">INPUT</span>
                </div>
                <span class="upgrade-desc">Enter 키로도 버튼 클릭 가능 (1회 한정)</span>
              </div>
            </div>
            <button class="btn upgrade-buy" id="btn-buy-enter">400점</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 패치노트 -->
  <section id="notes" class="screen">
    <button class="back" data-go="title">← 나가기</button>
    <div class="notes-wrap">
      <div class="notes-header">
        <h2 class="notes-title">Patch Notes</h2>
        <span class="notes-count" id="notes-count"></span>
      </div>
      <div class="notes" id="notes-list"></div>
    </div>
  </section>

<script>
  // ===== 패치노트 데이터 =====
  // 업데이트할 때마다 맨 위에 새 항목을 추가하세요. (v1부터 1씩 증가)
  const PATCH_NOTES = [
    {
      version: 5,
      date: "2026-11-21",
      changes: [
        "중앙 버튼이 납작해지던 버그 수정",
        "엔터 클릭 업그레이드 추가 (400점 소모, Enter 키로도 버튼 클릭 가능)",
        "업그레이드 탭 UI 전면 리뉴얼 (실시간 스탯, 아이콘, 태그 추가)",
      ],
    },
    {
      version: 4,
      date: "2026-11-21",
      changes: [
        "바운스 볼 업그레이드 추가 (200점 소모, 벽·버튼에 튕길 때마다 +2점)",
        "파워 클릭 업그레이드 추가 (300점 소모, 클릭당 점수 +3)",
      ],
    },
    {
      version: 3,
      date: "2026-11-21",
      changes: [
        "버튼을 100번 누르면 업그레이드 탭 해금",
        "100점을 소모해 클릭당 점수를 2로 올리는 업그레이드 추가 (1회 한정)",
      ],
    },
    {
      version: 2,
      date: "2026-11-21",
      changes: [
        "패치노트 UI를 블랙 & 화이트 카드 스타일로 개선",
        "버튼 입력 딜레이 제거 (누르는 즉시 반응)",
      ],
    },
    {
      version: 1,
      date: "2025-01-01",
      changes: [
        "최초 출시",
        "버튼을 누르면 1점 획득",
      ],
    },
  ];

  // ===== 화면 전환 =====
  const screens = {
    title: document.getElementById("title"),
    game: document.getElementById("game"),
    notes: document.getElementById("notes"),
  };

  function go(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  // ===== 패치노트 렌더링 =====
  function renderNotes() {
    const list = document.getElementById("notes-list");
    const count = document.getElementById("notes-count");
    const latestVersion = PATCH_NOTES[0]?.version ?? 0;
    count.textContent = `LATEST v${latestVersion}`;

    list.innerHTML = PATCH_NOTES.map((n, idx) => `
      <article class="note-card${idx === 0 ? " latest" : ""}">
        <div class="note-head">
          <div class="note-meta">
            <span class="note-version">v${n.version}</span>
            ${idx === 0 ? '<span class="note-badge">LATEST</span>' : ""}
          </div>
          <span class="note-date">${n.date}</span>
        </div>
        <ul class="note-list">
          ${n.changes.map(c => `<li>${c}</li>`).join("")}
        </ul>
      </article>
    `).join("");
  }
  renderNotes();

  // ===== 인게임 로직 =====
  let score = 0;
  let totalClicks = 0;
  let pointsPerClick = 1;
  let upgradeUnlocked = false;
  let doubleBought = false;
  let plus3Bought = false;
  let enterUnlocked = false;
  let balls = [];

  const scoreEl = document.getElementById("score");
  const gameBtn = document.getElementById("game-btn");
  const upgradeTabBtn = document.getElementById("btn-upgrade-tab");
  const upgradePanel = document.getElementById("upgrade-panel");
  const upgradeCloseBtn = document.getElementById("btn-upgrade-close");
  const buyDoubleBtn = document.getElementById("btn-buy-double");
  const buyBallBtn = document.getElementById("btn-buy-ball");
  const buyPlus3Btn = document.getElementById("btn-buy-plus3");
  const buyEnterBtn = document.getElementById("btn-buy-enter");
  const ballCountEl = document.getElementById("ball-count");
  const upgradeScoreEl = document.getElementById("upgrade-score");
  const upgradePpcEl = document.getElementById("upgrade-ppc");
  const itemDoubleEl = document.getElementById("item-double");
  const itemPlus3El = document.getElementById("item-plus3");
  const itemEnterEl = document.getElementById("item-enter");

  const ballCanvas = document.getElementById("ball-canvas");
  const ctx = ballCanvas.getContext("2d");

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ballCanvas.width = Math.floor(window.innerWidth * dpr);
    ballCanvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function addScore(amount) {
    score += amount;
    scoreEl.textContent = score;
    scoreEl.classList.remove("bump");
    void scoreEl.offsetWidth; // 애니메이션 재시작
    scoreEl.classList.add("bump");
    updateUpgradeUI();
  }

  function updateUpgradeUI() {
    upgradeTabBtn.classList.toggle("visible", upgradeUnlocked);
    upgradeScoreEl.textContent = score.toLocaleString();
    upgradePpcEl.textContent = `+${pointsPerClick}`;

    itemDoubleEl.classList.toggle("bought", doubleBought);
    if (doubleBought) {
      buyDoubleBtn.textContent = "완료";
      buyDoubleBtn.disabled = true;
    } else {
      buyDoubleBtn.textContent = "100점";
      buyDoubleBtn.disabled = score < 100;
    }

    ballCountEl.textContent = `(${balls.length})`;
    buyBallBtn.disabled = score < 200;

    itemPlus3El.classList.toggle("bought", plus3Bought);
    if (plus3Bought) {
      buyPlus3Btn.textContent = "완료";
      buyPlus3Btn.disabled = true;
    } else {
      buyPlus3Btn.textContent = "300점";
      buyPlus3Btn.disabled = score < 300;
    }

    itemEnterEl.classList.toggle("bought", enterUnlocked);
    if (enterUnlocked) {
      buyEnterBtn.textContent = "완료";
      buyEnterBtn.disabled = true;
    } else {
      buyEnterBtn.textContent = "400점";
      buyEnterBtn.disabled = score < 400;
    }
  }

  function spawnBall() {
    const r = 10;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const btnRect = gameBtn.getBoundingClientRect();
    const bcx = btnRect.left + btnRect.width / 2;
    const bcy = btnRect.top + btnRect.height / 2;
    const br = btnRect.width / 2;

    // 버튼과 겹치지 않는 위치에 생성
    let x = r + 20;
    let y = r + 20;
    for (let i = 0; i < 20; i++) {
      const tx = r + 20 + Math.random() * Math.max(10, w - (r + 20) * 2);
      const ty = r + 20 + Math.random() * Math.max(10, h - (r + 20) * 2);
      if (Math.hypot(tx - bcx, ty - bcy) > br + r + 24) {
        x = tx;
        y = ty;
        break;
      }
    }

    const angle = Math.random() * Math.PI * 2;
    const speed = 260 + Math.random() * 80;
    balls.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r,
    });
  }

  function resetGame() {
    score = 0;
    totalClicks = 0;
    pointsPerClick = 1;
    upgradeUnlocked = false;
    doubleBought = false;
    plus3Bought = false;
    enterUnlocked = false;
    balls = [];
    scoreEl.textContent = score;
    upgradePanel.classList.remove("open");
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    updateUpgradeUI();
  }

  function pressButton() {
    totalClicks += 1;
    if (!upgradeUnlocked && totalClicks >= 100) {
      upgradeUnlocked = true;
    }
    addScore(pointsPerClick);
  }

  // 공 물리 & 렌더링 루프
  let lastFrameTime = performance.now();
  function animateBalls(now) {
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    if (screens.game.classList.contains("active") && balls.length > 0) {
      const btnRect = gameBtn.getBoundingClientRect();
      const bcx = btnRect.left + btnRect.width / 2;
      const bcy = btnRect.top + btnRect.height / 2;
      const br = btnRect.width / 2;

      let bounceCount = 0;

      for (const b of balls) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // 화면 벽 충돌
        if (b.x - b.r <= 0) {
          b.x = b.r;
          b.vx = Math.abs(b.vx);
          bounceCount += 1;
        } else if (b.x + b.r >= w) {
          b.x = w - b.r;
          b.vx = -Math.abs(b.vx);
          bounceCount += 1;
        }

        if (b.y - b.r <= 0) {
          b.y = b.r;
          b.vy = Math.abs(b.vy);
          bounceCount += 1;
        } else if (b.y + b.r >= h) {
          b.y = h - b.r;
          b.vy = -Math.abs(b.vy);
          bounceCount += 1;
        }

        // 중앙 버튼(원형) 충돌
        const dx = b.x - bcx;
        const dy = b.y - bcy;
        const dist = Math.hypot(dx, dy);
        const minDist = br + b.r;
        if (dist < minDist) {
          const nx = dist === 0 ? 1 : dx / dist;
          const ny = dist === 0 ? 0 : dy / dist;
          b.x = bcx + nx * minDist;
          b.y = bcy + ny * minDist;

          const dot = b.vx * nx + b.vy * ny;
          if (dot < 0) {
            b.vx -= 2 * dot * nx;
            b.vy -= 2 * dot * ny;
            bounceCount += 1;
          }
        }

        // 공 그리기 (블랙 & 화이트 테마)
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(255, 255, 255, 0.5)";
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      }

      if (bounceCount > 0) {
        addScore(bounceCount * 2);
      }
    }

    requestAnimationFrame(animateBalls);
  }
  requestAnimationFrame(animateBalls);

  upgradeTabBtn.addEventListener("click", () => {
    updateUpgradeUI();
    upgradePanel.classList.add("open");
  });

  upgradeCloseBtn.addEventListener("click", () => {
    upgradePanel.classList.remove("open");
  });

  upgradePanel.addEventListener("click", (e) => {
    if (e.target === upgradePanel) {
      upgradePanel.classList.remove("open");
    }
  });

  buyDoubleBtn.addEventListener("click", () => {
    if (doubleBought || score < 100) return;
    score -= 100;
    pointsPerClick += 1;
    doubleBought = true;
    scoreEl.textContent = score;
    updateUpgradeUI();
  });

  buyBallBtn.addEventListener("click", () => {
    if (score < 200) return;
    score -= 200;
    spawnBall();
    scoreEl.textContent = score;
    updateUpgradeUI();
  });

  buyPlus3Btn.addEventListener("click", () => {
    if (plus3Bought || score < 300) return;
    score -= 300;
    pointsPerClick += 3;
    plus3Bought = true;
    scoreEl.textContent = score;
    updateUpgradeUI();
  });

  buyEnterBtn.addEventListener("click", () => {
    if (enterUnlocked || score < 400) return;
    score -= 400;
    enterUnlocked = true;
    scoreEl.textContent = score;
    updateUpgradeUI();
  });

  gameBtn.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    gameBtn.classList.add("pressed");
    pressButton();
  });

  const releaseVisual = () => gameBtn.classList.remove("pressed");
  gameBtn.addEventListener("pointerup", releaseVisual);
  gameBtn.addEventListener("pointercancel", releaseVisual);
  gameBtn.addEventListener("pointerleave", releaseVisual);

  window.addEventListener("keydown", (e) => {
    if (
      e.key === "Enter" &&
      !e.repeat &&
      enterUnlocked &&
      screens.game.classList.contains("active") &&
      !upgradePanel.classList.contains("open")
    ) {
      e.preventDefault();
      gameBtn.classList.add("pressed");
      pressButton();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "Enter") {
      releaseVisual();
    }
  });

  // ===== 버튼 이벤트 =====
  document.getElementById("btn-start").addEventListener("click", () => {
    resetGame();
    go("game");
  });
  document.getElementById("btn-notes").addEventListener("click", () => go("notes"));
  document.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => go(b.dataset.go))
  );
</script>
</body>
</html>
